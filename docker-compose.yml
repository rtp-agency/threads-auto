services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: threads
      POSTGRES_PASSWORD: threads
      POSTGRES_DB: threads
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threads"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      # только localhost: наружу API выходит через reverse-proxy (Caddy)
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: celery -A app.tasks:celery_app worker --loglevel=info
    env_file: .env
    volumes:
      - media:/data/media
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build: .
    command: celery -A app.tasks:celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  bot:
    build: .
    command: python -m app.bot.main
    env_file: .env
    volumes:
      - media:/data/media
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  media:
